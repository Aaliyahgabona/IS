






<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>


    <div class="box">
        <h1>Login</h1>
        <form action="login.php" method="POST">

            <div class="field">
                <label for="userID">Enter ID</label>
                <input type="text" id="userID" name="userID">
                <p id = "userIDMessage"></p>
            </div>
           
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <p id ="passwordMessage"></p>
            </div>

           

            <button type="submit">login</button>
        </form>
    </div>
   
     <script>
        let form = document.querySelector("form");
        let password = document.getElementById("password");
        let userID = document.getElementById("userID");


        
        let passwordMessage = document.getElementById("passwordMessage");
        let userIDMessage = document.getElementById("userIDMessage");
       
       

     form.addEventListener("submit", function(event) {
       let isValid = true;

        if (userID.value === "") {
            userIDMessage.textContent = "ID is required.";
            userIDMessage.style.color = "red";
            isValid = false;
        } else {
            userIDMessage.textContent = "";
        }

        if (password.value === "") {
            passwordMessage.textContent = "Password is required.";
            passwordMessage.style.color = "red";
            isValid = false;
        } else {
            passwordMessage.textContent = "";
        }

        if (!isValid) {
            event.preventDefault();
        }
     });

        
           
        

        </script> 


</body>
</html>
