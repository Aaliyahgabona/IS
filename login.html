

<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>


    <div class="box">
        <h1>Login</h1>
        <form>
            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name">
                <p id = "nameMesage"></p>
            </div>

             <div class="field">
                <label for="ID">Enter ID</label>
                <input type="text" id="ID">
                <p id = "IDMesage"></p>
            </div>
             <div class="field">
                <label for="school"> Enter school name</label>
                <input type="text" id="school">
                <p id = "schoolMesage"></p>
            </div>



          

            <div class="field">
                <label for="pass1">Password</label>
                <input type="password" id="pass1">
                <p id ="pass1Mesage"></p>
            </div>

            <div class="field">
                <label for="pass2">Confirm Password</label>
                <input type="password" id="pass2" >
                <p id ="pass2Mesage"></p>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        let form = document.querySelector("form");
        let name= document.getElementById("name");
        let pass1 = document.getElementById("pass1");
        let pass2 = document.getElementById("pass2");

        
        let nameMesage = document.getElementById("nameMesage");
        let pass1Mesage = document.getElementById("pass1Mesage");
        let pass2Mesage = document.getElementById("pass2Mesage");
       

     form.addEventListener("submit", function(event) {
        event.preventDefault();

        if (name.value === "") {
            nameMesage.textContent = "Name is required.";
            nameMesage.style.color = "red";
            nameMesage.classList.add ("error");
        } 
        else {
            nameMesage.textContent = "";
            nameMesage.classList.add ("error");
        }

         if (ID.value === "") {
            IDMesage.textContent = "ID is required.";
            IDMesage.style.color = "red";
            IDMesage.classList.add ("error");
        } 
        else {
            IDMesage.textContent = "";
            IDMesage.classList.add ("error");
        }

        if (school.value === "") {
            schoolMesage.textContent = "School name is required.";
            schoolMesage.style.color = "red";
            schoolMesage.classList.add ("error");
        } 
        else {
            schoolMesage.textContent = "";
            schoolMesage.classList.add ("error");
        }

        if (pass1.value !== pass2.value) {
            pass2Mesage.textContent = "Passwords do not match.";
            pass2Mesage.classList.add ("error");
           pass2Mesage.style.color = "red";
        } 
        else {
            pass1Mesage.textContent = "";
            pass1Mesage.classList.add ("error");
        }

     });

       
      
    </script>

</body>
</html>
