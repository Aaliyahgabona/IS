<html>
    <head>
        <title>mobilepay</title>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        <h1>Mobilepay</h1>
        <form action="/mobilepay" method="post">
            <label for="mpesa_number">M-Pesa Number:</label>
            <input type="text" id="mpesa_number" name="mpesa_number" required><br><br>

            <label for="amount">Amount:</label>

            <button type="button">Enter</button>
        </form>
    </body>
</html>
